version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: ramdoot-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ramdoot
      POSTGRES_PASSWORD: ramdoot123
      POSTGRES_DB: ramdoot_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ramdoot -d ramdoot_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis Cache & Queue
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: ramdoot-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Adminer (Database Management UI)
  # ==========================================
  adminer:
    image: adminer:latest
    container_name: ramdoot-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - postgres

  # ==========================================
  # Redis Commander (Redis Management UI)
  # ==========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ramdoot-redis-commander
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis

volumes:
  postgres-data:
  redis-data:
